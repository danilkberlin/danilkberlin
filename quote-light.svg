-size="14.5" fill="#262528" letter-spacing="0" >there is nothing more to add, but</text><rect x="0" y="0" width="307.6" height="21.8" fill="#ffffff" style="transform:translateX(291.1px);animation:cover 0.97s steps(33) 1.46s both"/></svg><rect x="63.0" y="114.5" width="8.4" height="16.7" fill="#b83a4b" style="transform:translateX(289.1px);animation:pre 1.46s linear backwards,cover 0.97s steps(33) 1.46s both,blink 1.05s steps(1) 2.43s infinite,hide .01s linear 2.45s forwards"/><svg x="60.0" y="133.4" width="316.3" height="21.8" overflow="hidden"><text x="2" y="16.7" class="m" font-size="14.5" fill="#262528" letter-spacing="0" >when there is nothing left to take</text><rect x="0" y="0" width="316.3" height="21.8" fill="#ffffff" style="transform:translateX(299.8px);animation:cover 1.00s steps(34) 2.48s both"/></svg><rect x="63.0" y="137.0" width="8.4" height="16.7" fill="#b83a4b" style="transform:translateX(297.8px);animation:pre 2.48s linear backwards,cover 1.00s steps(34) 2.48s both,blink 1.05s steps(1) 3.48s infinite,hide .01s linear 3.50s forwards"/><svg x="60.0" y="155.9" width="64.0" height="21.8" overflow="hidden"><text x="2" y="16.7" class="m" font-size="14.5" fill="#262528" letter-spacing="0" >away.</text><rect x="0" y="0" width="64.0" height="21.8" fill="#ffffff" style="transform:translateX(47.5px);animation:cover 0.15s steps(5) 3.53s both"/></svg><rect x="63.0" y="159.5" width="8.4" height="16.7" fill="#b83a4b" style="transform:translateX(45.5px);animation:pre 3.53s linear backwards,cover 0.15s steps(5) 3.53s both,blink 1.05s steps(1) 3.68s infinite"/><text x="62" y="205" class="mb up" font-size="11.5" letter-spacing="1" fill="#9b5f84" style="animation-delay:3.93s">— Antoine de Saint-Exupéry</text></svg>