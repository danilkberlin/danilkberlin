<svg xmlns="http://www.w3.org/2000/svg" width="412" height="260" viewBox="0 0 412 260" role="img" aria-label="“Perfection is achieved not when there is nothing more to add, but when there is nothing left to take away.” — Antoine de Saint-Exupéry"><title>“Perfection is achieved not when there is nothing more to add, but when there is nothing left to take away.” — Antoine de Saint-Exupéry</title><style>@font-face{font-family:Orb;font-weight:900;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:JBM;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:JBM;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}.o{font-family:Orb,JBM,sans-serif;font-weight:900}.o7{font-family:Orb,JBM,sans-serif;font-weight:700}.m{font-family:JBM,ui-monospace,monospace;font-weight:400}.mb{font-family:JBM,ui-monospace,monospace;font-weight:700}text{dominant-baseline:auto}.fade{animation:fade .8s ease both}.up{animation:up .8s cubic-bezier(.2,.8,.2,1) both}.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 2s ease-out both}.roll{animation:roll 2.2s cubic-bezier(.15,.85,.25,1) both}.growy{transform-box:fill-box;transform-origin:50% 100%;animation:growy 1s cubic-bezier(.2,.9,.3,1.2) both}.growx{transform-box:fill-box;transform-origin:0 50%;animation:growx 1.1s cubic-bezier(.2,.9,.3,1) both}.blink{animation:blink 1.05s steps(1) infinite}.twinkle{animation:twinkle 3s ease-in-out infinite}.cover{animation:cover 1s both}@keyframes fade{from{opacity:0}}@keyframes up{from{opacity:0;transform:translateY(12px)}}@keyframes pop{from{opacity:0;transform:scale(.4)}}@keyframes draw{from{stroke-dashoffset:1}}@keyframes roll{from{transform:translateY(0)}}@keyframes growy{from{transform:scaleY(0)}}@keyframes growx{from{transform:scaleX(0)}}@keyframes blink{50%{opacity:0}}@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}@keyframes 