eX(330px)}}.nudge{animation:nudge 5.4s ease-in-out infinite}@keyframes nudge{0%,30%,100%{transform:translate(0,0)}15%{transform:translate(2px,-2px)}}</style><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.50" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="glow2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8.00" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#201f21"/><stop offset="1" stop-color="#161517"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="0.22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="pill"><rect x="1" y="1" width="198" height="50" rx="25.0"/></clipPath></defs><rect x="3" y="3" width="194" height="46" rx="23.0" fill="none" stroke="#f5c46b" stroke-width="2.5" filter="url(#glow2)" class="halo" style="animation-delay:4.05s"/><rect x="1" y="1" width="198" height="50" rx="25.0" fill="url(#bg)" stroke="#f5c46b" stroke-opacity=".85" stroke-width="1.2"/><g clip-path="url(#pill)"><rect x="-90" y="-10" width="70" height="72" fill="url(#shine)" transform="skewX(-20)" class="shine" style="animation-delay:5.25s"/></g><g class="pop" style="animation-delay:0.46s"><g transform="translate(22 16)" fill="none" stroke="#f5c46b" stroke-width="1.6"><circle cx="10" cy="10" r="9"/><ellipse cx="10" cy="10" rx="4" ry="9"/><path d="M1,10 H19 M2.6,5.2 H17.4 M2.6,14.8 H17.4"/></g></g><text x="54" y="30.9" class="o7 up" font-size="13" letter-spacing="2.2" fill="#f2ede7" style="animation-delay:0.56s">PORTFOLIO</text><path d="M168,30.0 L176,22.0 M170,22.0 H176 V28.0" fill="none" stroke="#f5c46b" stroke-width="1.6" stroke-linecap="round" stroke-linejo