name: profile

# Re-renders every README image and force-pushes them to the orphan `output`
# branch (one commit, so daily GIFs never bloat history). The README itself
# only points at raw.githubusercontent.com/<user>/<user>/output/*.

on:
  schedule:
    - cron: "17 1 * * *" # 02:17 in Berlin (03:17 in summer); odd minute dodges the top-of-hour rush
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generator/**"
      - "profile.yml"
      - "requirements.txt"
      - ".github/workflows/profile.yml"
  pull_request:

permissions:
  contents: write # push the output branch
  actions: write # keep the nightly schedule enabled

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest

      - name: Render
        env:
          # Optional: a PAT (read:user, repo) adds private contributions to the totals.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python -m generator --out dist

      - name: Upload preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: profile-images
          path: dist

      - name: Deploy to the output branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Render #${GITHUB_RUN_NUMBER} ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push -f -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output

      - name: Keep the schedule alive
        # GitHub disables cron workflows after 60 days without repository activity.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/profile.yml/enable"
